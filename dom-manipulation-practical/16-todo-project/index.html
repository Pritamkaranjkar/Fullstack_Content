<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo Project - DOM Practical</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Todo Project</h1>
    <p>DOM Manipulation Practical</p>
  </header>

  <main>
    
    <section class="card">
      <h2>Todo List</h2>

      </div>
      <ul id="todoList"></ul>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
